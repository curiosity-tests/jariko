name: Unit Test
run-name: "Unit Test ${{ inputs.leg || github.event_name }} ${{ inputs.racecar_run }}"

on:
  pull_request:
    branches:
      - master
      - develop
  workflow_dispatch:
    inputs:
      leg:
        description: "baseline (uninstrumented) or instrumented (under chalk/curiosity)"
        type: choice
        options: [instrumented, baseline]
        default: baseline
      profile:
        description: "CrashOverride chalk profile"
        type: string
        default: curiosity-tests-racecar
      racecar_run:
        description: "racecar correlation token, echoed into the run name"
        type: string
        default: ""


env:
  CHALK_ON: ${{ inputs.leg == 'instrumented' }}
jobs:
  unit-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-java@v5
      with:
        java-version: 11
        distribution: zulu
    - uses: gradle/actions/setup-gradle@v6
    - name: Checking kotlin formatting
      run: ./gradlew ktlintCheck
    - name: Compiling and test
      run: ./gradlew check
